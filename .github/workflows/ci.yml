name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --python 3.13 --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: population_names_test
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --python 3.13 --extra dev
      - run: uv run pytest tests/ -v --tb=short --cov=src --cov=pipeline --cov=scripts --cov-report=term-missing
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://pipeline:pipeline@localhost:5432/population_names_test
          DATABASE_URL: postgresql+asyncpg://pipeline:pipeline@localhost:5432/population_names_test
          DATABASE_URL_SYNC: postgresql://pipeline:pipeline@localhost:5432/population_names_test
          API_KEY: test-api-key
          AIRFLOW_PASSWORD: test

  dbt-validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: population_names_test
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
      POSTGRES_DB: population_names_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --python 3.13 --extra dev
      - run: uv pip install dbt-postgres
      - name: Run Alembic migrations
        run: uv run alembic upgrade head
        env:
          DATABASE_URL_SYNC: postgresql://pipeline:pipeline@localhost:5432/population_names_test
      - run: cd dbt_project && uv run dbt deps --profiles-dir .
      - run: cd dbt_project && uv run dbt run --profiles-dir .
      # dbt test requires ingested data; validates compilation only in CI

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t api-test .
      - run: docker build -t airflow-test -f Dockerfile.airflow .
      - run: docker build -t dbt-test -f Dockerfile.dbt .
